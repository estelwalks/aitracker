<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" color="#111827" role="img" aria-labelledby="title desc">
  <title id="title">AITracker light icon</title>
  <desc id="desc">A scanning frame with three rising points and luminous motion trails on a transparent background.</desc>
  <defs>
    <!-- The three light trails are part of the mark at every native size. -->
    <symbol id="native-mark" viewBox="0 0 16 16">
      <defs>
        <linearGradient id="native-trail" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="currentColor" stop-opacity="0.10"/>
          <stop offset="0.48" stop-color="currentColor" stop-opacity="0.48"/>
          <stop offset="1" stop-color="currentColor" stop-opacity="0.82"/>
        </linearGradient>
      </defs>
      <g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
        <path d="M6 1.75H4.75A3 3 0 0 0 1.75 4.75V6"/>
        <path d="M10 1.75H11.25A3 3 0 0 1 14.25 4.75V6"/>
        <path d="M1.75 10V11.25A3 3 0 0 0 4.75 14.25H6"/>
        <path d="M14.25 10V11.25A3 3 0 0 1 11.25 14.25H10"/>
      </g>
      <g id="native-trails" fill="none" stroke="url(#native-trail)" stroke-linecap="butt">
        <path d="M2.75 12.25L4.75 9.25" stroke-width="0.9"/>
        <path d="M4.25 12.75L7.75 7.75" stroke-width="1.2"/>
        <path d="M6.5 13L11 6" stroke-width="1.5"/>
      </g>
      <g fill="currentColor">
        <circle cx="4.75" cy="9.25" r="0.8"/>
        <circle cx="7.75" cy="7.75" r="1.1"/>
        <circle cx="11" cy="6" r="1.45"/>
      </g>
    </symbol>
  </defs>
  <use href="#native-mark" width="1024" height="1024"/>
</svg>
