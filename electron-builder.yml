# Packaging identity (appId/productName) mirrors src/lib/app-config.ts —
# change APP_NAME/APP_ID there first, then update this file and
# scripts/package-mac.mjs artifact names together.
appId: com.aitracker.desktop
productName: AITracker
asar: true
npmRebuild: false
directories:
  output: release
files:
  - build/electron/**/*
  # Tests are compiled by the Electron TypeScript project for local unit-test
  # runs, but are not runtime dependencies of the packaged application.
  - "!build/electron/**/*.test.js"
  - "!build/electron/**/*.test.js.map"
  - package.json
  - "!node_modules/**/*"
  # Main-process-only scanner runtime. Its ESM bundle loads Prompt markdown at
  # module initialization even for quick scans, and imports zod at runtime.
  - node_modules/skill-scanner/dist/**/*
  - node_modules/skill-scanner/package.json
  - node_modules/zod/**/*
extraResources:
  # Native menu-bar images are kept outside the web bundle. macOS resolves the
  # Template/@2x pair by filename, so the resources must remain adjacent and
  # unhashed in the final .app bundle on both Intel and Apple Silicon builds.
  - from: public/build
    to: tray
    filter:
      - "tray-iconTemplate.png"
      - "tray-iconTemplate@2x.png"
  - from: .output
    to: web
    filter:
      - "**/*"
afterPack: electron/after-pack.cjs
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/brand-logos/ai-tracker/ai-tracker-icon-app.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # 最小权限 entitlements:仅 hardened runtime 必需(Chromium JIT),不含
  # App Sandbox 与任何 files.* 目录权限 —— 应用只读写 ~/.aitracker 与
  # Application Support,不请求文稿/桌面/下载等 TCC 目录(见 build/entitlements.mac.plist)。
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/brand-logos/ai-tracker/ai-tracker-icon-app.png
nsis:
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
  oneClick: false
  # Install for all users; the NSIS default becomes C:\Program Files\AITracker.
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
