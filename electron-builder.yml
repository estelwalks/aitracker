appId: com.trusttools.desktop
productName: AITracker
asar: true
npmRebuild: false
directories:
  output: release
files:
  - build/electron/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: .output
    to: web
    filter:
      - "**/*"
  - from: build/tray-icon.png
    to: tray-icon.png
afterPack: electron/after-pack.cjs
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
