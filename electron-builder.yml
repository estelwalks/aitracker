# Packaging identity (appId/productName) mirrors src/lib/app-config.ts —
# change APP_NAME/APP_ID there first, then update this file and
# scripts/package-mac.mjs artifact names together.
appId: com.aitracker.desktop
productName: AITracker
asar: true
npmRebuild: false
directories:
  output: release
files:
  - build/electron/**/*
  # Tests are compiled by the Electron TypeScript project for local unit-test
  # runs, but are not runtime dependencies of the packaged application.
  - "!build/electron/**/*.test.js"
  - "!build/electron/**/*.test.js.map"
  - package.json
  - "!node_modules/**/*"
  # Main-process-only scanner runtime. Its ESM bundle loads Prompt markdown at
  # module initialization even for quick scans, and imports zod at runtime.
  - node_modules/@estelwalks/agent-threat-scanner/dist/**/*
  - node_modules/@estelwalks/agent-threat-scanner/package.json
  - node_modules/zod/**/*
extraResources:
  # The build generates raster templates, DPI-specific ICO frames and ICNS
  # from the two canonical SVG files, including their optical small-size mark.
  - from: build/native-icons
    to: native-icons
    filter:
      - "**/*"
  - from: .output
    to: web
    filter:
      - "**/*"
afterPack: electron/after-pack.cjs
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  # Dock/Finder app icon has a white tile; menu-bar templates stay transparent.
  icon: build/native-icons/mac-app.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # Least-privilege entitlements: only what hardened runtime requires
  # (Chromium JIT). No App Sandbox and no files.* directory permissions —
  # the app only reads/writes ~/.aitracker and Application Support, and never
  # requests TCC directories such as Documents/Desktop/Downloads
  # (see build/entitlements.mac.plist).
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  # Installer names carry the operating system but never a version: the name is
  # what `releases/latest/download/<name>` resolves, so it must stay stable
  # across releases, and the READMEs, the updater, `npx @estelwalks/aitracker`
  # and the Homebrew casks all depend on it. The app version inside the
  # DMG/app.asar is unaffected.
  #
  # Renaming any of these is a one-release change that MUST reach
  # release-metadata.json in the same release: a client selects the installer by
  # extension and architecture, then requires the name recorded in that
  # release's metadata to be an asset of that same release. Half a rename — new
  # asset names with metadata still naming the old ones — fails the in-app
  # update on every install of 1.0.3 and later. `npm run test:release` and the
  # post-draft check in .github/workflows/release.yml both fail on that state.
  # scripts/verify-release-artifact-names.mjs pins the four rendered names.
  artifactName: "${productName}-macOS-${arch}.${ext}"
  # Explicit volume icon for the installer mounted on the desktop.
  icon: build/native-icons/mac-app.icns
win:
  target:
    - target: nsis
      arch:
        - x64
        # Windows on ARM. Cross-built from an x64 host: the app payload is the
        # native win32-arm64 Electron build, while the NSIS installer stub
        # itself stays x86 and runs under Windows' x86 emulation (the bundled
        # NSIS 3.0.4.1 emits no ARM64 stub; its templates pick app-64 or
        # app-arm64 at install time via ${IsNativeARM64}).
        #
        # These entries only apply when no target/arch is named on the command
        # line. `npm run dist:win` (bare `--win`) then emits a combined
        # AITracker-Windows-<arch>.exe carrying both payloads plus one
        # installer per architecture, while `npm run dist:win:x64` and
        # `npm run dist:win:arm64` pass an explicit arch (which overrides this
        # list) and emit exactly one installer each — that is what the release
        # workflow builds.
        - arm64
  # Keep the EXE and pinned shortcut transparent, like the running window.
  # The three light trails remain part of the artwork at every icon size.
  icon: build/native-icons/icon.ico
nsis:
  # Versionless for the same reason as the DMG name above.
  artifactName: "${productName}-Windows-${arch}.${ext}"
  oneClick: false
  # Install for all users. Note the default directory, which comes from
  # electron-builder's multiUser.nsh: it only promotes $PROGRAMFILES to
  # $PROGRAMFILES64 inside `!ifdef APP_64`, and a 32-bit NSIS process resolves
  # $PROGRAMFILES to the x86 view (verified with a probe built by the bundled
  # makensis: $PROGRAMFILES=C:\Program Files (x86),
  # $PROGRAMFILES64=C:\Program Files). So the x64 installer lands in
  # C:\Program Files\AITracker, while the arm64-only installer — which defines
  # APP_ARM64 but not APP_64 — lands in C:\Program Files (x86)\AITracker.
  # The "Apps & features" entry is unaffected either way (check64BitAndSetRegView
  # sets the 64-bit registry view for APP_ARM64), and users can still choose a
  # directory because allowToChangeInstallationDirectory is enabled.
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  # `${arch}` does NOT render "x64" on Linux: builder-util switches it to
  # x86_64 for AppImage/rpm and amd64 for deb. That would give one platform two
  # different suffixes, breaking the "one stable name per platform" contract the
  # release metadata, the README links and the CLI all resolve against. The arch
  # is therefore spelled literally, and an arm64 build must override this name
  # on the command line rather than reintroducing ${arch}.
  artifactName: "${productName}-Linux-x64.${ext}"
  # deb/rpm/pacman cannot be built without a maintainer: fpm fails with
  # authorEmailIsMissed when neither `linux.maintainer` nor a package.json
  # `author` with an email is present.
  maintainer: AITracker Maintainers <maintainers@aitracker.dev>
  vendor: AITracker
  # Freedesktop main category (see the desktop entry below).
  category: Development
  synopsis: AI development asset dashboard
  description: Local-first dashboard for AI token usage, cost, skills and memory.
  # Keep executableName under linux:. A ROOT-level executableName also renames
  # the macOS payload through appInfo.productFilename.
  executableName: aitracker
  # Window association, end to end. Without syncDesktopName the entry is named
  # from `executableName`; with it, from package.json `desktopName`. Both are
  # "aitracker" here, matching APP_DESKTOP_NAME, so the installed basename and
  # Electron's app_id / WM_CLASS agree:
  #   /usr/share/applications/aitracker.desktop  (deb)
  #   <AppDir>/aitracker.desktop                 (AppImage)
  # They did NOT agree before this was pinned: a real build wrote
  # aitracker.desktop while the app announced AITracker.desktop, which breaks
  # portal app-id lookup on every desktop. See
  # dev-docs/linux/07-测试与验收.md §3.
  syncDesktopName: true
  # Linux needs a directory of sized PNGs — .icns and .ico are not usable here.
  # Without an explicit linux.icon the resolver falls back to mac.icon and would
  # ship the white-plate Dock artwork, converting it through a downloaded
  # toolset. A directory of `NxN.png` files is used verbatim, with no download.
  # scripts/generate-native-icons.mjs produces this set (16..512; a 1024 entry
  # would create a non-standard hicolor/1024x1024 directory).
  icon: build/native-icons/linux
  desktop:
    entry:
      Name: AITracker
      Comment: AI development asset dashboard
      # An override is written verbatim, so the trailing ";" is required.
      Categories: Development;
      # StartupWMClass is the X11 window class, which Electron derives from
      # `app.setDesktopName(...)` (APP_DESKTOP_NAME, i.e. "aitracker") and not
      # from the product name. It must match or the taskbar icon and window
      # grouping break.
      StartupWMClass: aitracker
deb:
  priority: optional
  # electron-builder's default list omits libgbm1 (a hard Electron dependency
  # that libgtk-3-0 does not pull in) and predates Ubuntu 24.04's t64 rename of
  # libasound2, hence the alternative dependency below.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2 | libasound2t64
    - libxkbcommon0
    - libxdamage1
    - libxcomposite1
    - libxrandr2
    - libcups2
    - libdrm2
    - libpango-1.0-0
    - libcairo2
    # Status-area icon. Without a StatusNotifierItem host Electron falls back to
    # the deprecated GtkStatusIcon, which native GNOME Shell does not display at
    # all: the app would keep running with no visible way back to its window.
    # One of the two sonames, because distributions ship either the ayatana or
    # the legacy package.
    - libayatana-appindicator3-1 | libappindicator3-1
appImage:
  # Versionless for the same reason as the DMG and NSIS names above.
  artifactName: "${productName}-Linux-x64.${ext}"
  # The default FUSE2 runtime is used. Verified on a libfuse3-only host (Kali
  # rolling): plain execution fails with `dlopen(): error loading libfuse.so.2`
  # and the documented `--appimage-extract-and-run` fallback starts the app
  # normally. Ubuntu 22.04 ships libfuse2; 24.04+ and Debian 12+ need
  # libfuse2t64 / libfuse2, which cannot be expressed as a deb dependency
  # because an AppImage carries no package metadata.
  #
  # AppImageTarget.js:26 injects `--no-sandbox` into the generated Exec= unless
  # `toolsets.appimage` is configured, so an AppImage started from the desktop
  # menu runs without the Chromium sandbox. Setting `executableArgs: []` lets
  # AppRun probe unprivileged user namespaces instead — at the cost of failing
  # to start on hosts that disable them. See
  # dev-docs/linux/07-测试与验收.md §4.
