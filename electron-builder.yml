# Packaging identity (appId/productName) mirrors src/lib/app-config.ts —
# change APP_NAME/APP_ID there first, then update this file and
# scripts/package-mac.mjs artifact names together.
appId: com.aitracker.desktop
productName: AITracker
asar: true
npmRebuild: false
directories:
  output: release
files:
  - build/electron/**/*
  # Tests are compiled by the Electron TypeScript project for local unit-test
  # runs, but are not runtime dependencies of the packaged application.
  - "!build/electron/**/*.test.js"
  - "!build/electron/**/*.test.js.map"
  - package.json
  - "!node_modules/**/*"
  # Main-process-only scanner runtime. Its ESM bundle loads Prompt markdown at
  # module initialization even for quick scans, and imports zod at runtime.
  - node_modules/@l3m0nc9/agent-threat-scanner/dist/**/*
  - node_modules/@l3m0nc9/agent-threat-scanner/package.json
  - node_modules/zod/**/*
extraResources:
  # Native tray/window APIs require raster images. The build generates these
  # light/dark derivatives from the two canonical SVG files.
  - from: build/native-icons
    to: native-icons
    filter:
      - "**/*"
  - from: .output
    to: web
    filter:
      - "**/*"
afterPack: electron/after-pack.cjs
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/favicon.svg
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # Least-privilege entitlements: only what hardened runtime requires
  # (Chromium JIT). No App Sandbox and no files.* directory permissions —
  # the app only reads/writes ~/.aitracker and Application Support, and never
  # requests TCC directories such as Documents/Desktop/Downloads
  # (see build/entitlements.mac.plist).
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/favicon.svg
nsis:
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
  oneClick: false
  # Install for all users; the NSIS default becomes C:\Program Files\AITracker.
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
