# Packaging identity (appId/productName) mirrors src/lib/app-config.ts —
# change APP_NAME/APP_ID there first, then update this file and
# scripts/package-mac.mjs artifact names together.
appId: com.trusttools.desktop
productName: AITracker
asar: true
npmRebuild: false
directories:
  output: release
files:
  - build/electron/**/*
  - package.json
  - "!node_modules/**/*"
  # Main-process-only scanner runtime. Its ESM bundle loads Prompt markdown at
  # module initialization even for quick scans, and imports zod at runtime.
  - node_modules/skill-scanner/dist/**/*
  - node_modules/skill-scanner/package.json
  - node_modules/zod/**/*
extraResources:
  - from: .output
    to: web
    filter:
      - "**/*"
  - from: build/tray-icon.png
    to: tray-icon.png
afterPack: electron/after-pack.cjs
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # 最小权限 entitlements:仅 hardened runtime 必需(Chromium JIT),不含
  # App Sandbox 与任何 files.* 目录权限 —— 应用只读写 ~/.trusttools 与
  # Application Support,不请求文稿/桌面/下载等 TCC 目录(见 build/entitlements.mac.plist)。
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
