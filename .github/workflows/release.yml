name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: 24
  RELEASE_CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}

jobs:
  release-contract:
    name: Release contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL"

      # Installer names carry the operating system and no version, so
      # `releases/latest/download/<name>` stays valid across releases. Fail
      # before four runners start if the packaging config, the release scripts
      # or the READMEs have drifted apart — a name that reaches the packaging
      # config but not release-metadata.json breaks every in-app update.
      - name: Verify versionless installer names and README download links
        run: |
          npm run verify:release-artifact-names
          npm run verify:readme-release-links

  build:
    name: Build ${{ matrix.name }} installer
    needs: release-contract
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            platform: darwin-arm64
            command: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
            artifact_name: release-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            platform: darwin-x64
            command: npm run dist:mac:x64
            artifact_glob: release/*.dmg
            artifact_name: release-macos-x64
          - name: Windows x64
            os: windows-latest
            platform: win32-x64
            command: npm run dist:win:x64
            artifact_glob: release/*.exe
            artifact_name: release-windows-x64
          # Windows on ARM is cross-built on the x64 runner: electron-builder
          # downloads the win32-arm64 Electron payload and NSIS emits a
          # separate AITracker-Windows-arm64.exe. No ARM64 runner is required to
          # produce the installer.
          - name: Windows arm64
            os: windows-latest
            platform: win32-arm64
            command: npm run dist:win:arm64
            artifact_glob: release/*.exe
            artifact_name: release-windows-arm64
          # Electron cannot be cross-built: the app's native build dependencies
          # (@resvg/resvg-js, @tailwindcss/oxide, lightningcss) install only the
          # host platform's bindings, and `npm ci` on macOS or Windows would
          # produce a Linux payload without them. This leg therefore runs on a
          # real Linux runner.
          #
          # ubuntu-22.04 rather than -latest: the packaged glibc floor comes from
          # the Electron payload that gets downloaded (npmRebuild is false), but
          # the runner also supplies the fpm and AppImage toolchains, and 22.04
          # is the conservative choice for the widest user compatibility.
          #
          # The .deb and the .rpm are attached for people who prefer a system
          # package, but the AppImage is what the release metadata records and
          # what the in-app updater and the npx CLI hand over. The metadata
          # contract allows one artifact per platform key, and the CLI's
          # validator rejects an artifact carrying an unknown field, so the two
          # system packages are release assets the READMEs link rather than
          # metadata entries — a deb/rpm install updates through its own package
          # manager. `scripts/verify-release-contract.mjs` requires all three to
          # be present in the release directory.
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux-x64
            command: npm run dist:linux:x64
            artifact_glob: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
            artifact_name: release-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # No Developer ID, notarization, or SmartScreen credential is configured,
      # so electron-builder itself does not sign. macOS re-signing happens in
      # electron/after-pack.cjs, which picks the first available identity:
      # CSC_NAME, then a Developer ID certificate, then a self-signed
      # "AITracker" certificate, then ad-hoc.
      #
      # Ad-hoc is the fallback and it costs users a re-grant: macOS TCC stores a
      # code requirement that collapses to the binary's cdhash, so every release
      # looks like a new app and asks for Documents/Desktop/Downloads access
      # again. Export the project's self-signed code-signing certificate as a
      # .p12, add it as the MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD secrets, and set
      # the MAC_CSC_NAME repository variable; the step below then imports it and
      # the requirement becomes a stable `certificate leaf` anchor.
      CSC_IDENTITY_AUTO_DISCOVERY: false
      CSC_NAME: ${{ vars.MAC_CSC_NAME }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      # Fail the release instead of silently publishing an ad-hoc bundle once a
      # certificate is configured — a misconfigured secret should be loud.
      # Forks and pull requests never receive repository secrets, so their
      # macOS builds stay ad-hoc and still succeed.
      AITRACKER_REQUIRE_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != ''
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # codesign only searches keychains already on the search list.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag before packaging (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL"

      - name: Verify tag before packaging (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run verify:release-contract -- --tag "$env:GITHUB_REF_NAME" --channel "$env:RELEASE_CHANNEL"

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Verify expected installer name (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL" --release-dir release --platform "$RELEASE_PLATFORM"

      - name: Verify expected installer name (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: npm run verify:release-contract -- --tag "$env:GITHUB_REF_NAME" --channel "$env:RELEASE_CHANNEL" --release-dir release --platform "$env:RELEASE_PLATFORM"

      - name: Upload installer for release assembly
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          compression-level: 0

  # Installs the built packages on the distributions they target and starts the
  # app. Two things can only be proven here:
  #
  #   * `dnf install` resolves the RPM's Requires against real repositories, so a
  #     mistyped package name fails the release instead of shipping a package
  #     nobody can install;
  #   * the installed .desktop basename and StartupWMClass match what
  #     app.setDesktopName announces, which is the check that caught the original
  #     filename mismatch.
  #
  # A container has no StatusNotifierItem host, so the tray is expected to be
  # absent here; that path is covered by window-all-closed instead.
  install-smoke:
    name: Install smoke test (${{ matrix.image }})
    needs: [release-contract, build]
    if: ${{ needs.release-contract.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # RHEL 9 and 10 are the two supported Red Hat majors, and Fedora carries
        # the newest sonames and package renames. Debian/Ubuntu are covered by
        # the deb leg below.
        image:
          - rockylinux:9
          - rockylinux:10
          - fedora:latest
          - debian:13
          - ubuntu:24.04
    container:
      image: ${{ matrix.image }}
      # Electron needs a writable /dev/shm; the container default is too small.
      options: --shm-size=1g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the Linux installers
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: packages

      - name: Install the distribution package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f packages/AITracker-Linux-x64.rpm ]; then
            dnf install -y ./packages/AITracker-Linux-x64.rpm
          else
            apt-get update
            apt-get install -y ./packages/AITracker-Linux-x64.deb
          fi

      - name: Assert the packaging put the expected files in place
        shell: bash
        run: |
          set -euo pipefail
          test -f /usr/share/applications/aitracker.desktop
          grep -qx 'StartupWMClass=aitracker' /usr/share/applications/aitracker.desktop
          for size in 16 24 32 48 64 128 256 512; do
            test -f "/usr/share/icons/hicolor/${size}x${size}/apps/aitracker.png"
          done
          test -x /opt/AITracker/aitracker

      - name: Install the probe tooling
        shell: bash
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y xorg-x11-server-Xvfb xdotool x11-utils sqlite
          else
            apt-get update
            apt-get install -y xvfb xdotool x11-utils sqlite3
          fi

      - name: Start a virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1366x768x24 -nolisten tcp &
          for _ in $(seq 1 40); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.5
          done
          xdpyinfo -display :99 >/dev/null

      - name: Run the installed-package runtime probe
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux-runtime-probe.sh --installed /opt/AITracker/aitracker :99 1366x768

  draft-release:
    name: Assemble GitHub draft release
    needs: [release-contract, build, install-smoke]
    if: ${{ needs.release-contract.result == 'success' && needs.build.result == 'success' && needs.install-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download every installer
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify assembled release artifacts
        shell: bash
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL" --release-dir release

      - name: Generate release metadata and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm run release:metadata -- --release-dir release --version "$version" --channel "$RELEASE_CHANNEL"

      - name: Refuse to reuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::A GitHub release already exists for $GITHUB_REF_NAME; refusing to overwrite it."
            exit 1
          fi

      # Release notes stay short on purpose: the release page is an update
      # summary plus a pointer, not a second README. The changelog section is
      # the single source for "what changed"; installation methods, checksums
      # guidance and the signing caveat live in the README and RELEASE_CHECKLIST.
      # The page is bilingual — English first, Chinese second — and both lists
      # come from the same `## [<version>]` section: `### Highlights` plus the
      # optional `### 更新摘要`. The script fails the job when the section is
      # missing or blank, so a tag can no longer ship generic or stale notes.
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            : > release-notes.md
            echo "RELEASE_TITLE=AITracker $GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            cat > release-notes.md <<'EOF'
          Unsigned beta release for manual verification. Review the assets and checksums before using this prerelease.

          未签名的 beta 版本，仅供手动验证；使用前请先核对附件与校验值。

          EOF
            echo "RELEASE_TITLE=AITracker $GITHUB_REF_NAME (unsigned beta)" >> "$GITHUB_ENV"
          fi
          # Writes `## What's changed`, the English highlights, and — when the
          # version carries a `### 更新摘要` — `## 本次更新` with the Chinese ones.
          node scripts/changelog-release-notes.mjs --version "$version" --output - >> release-notes.md
          # Quoted heredoc: the inline code below must survive without backticks
          # being read as command substitution.
          cat >> release-notes.md <<'EOF'

          ## Download

          Installers are attached below: `AITracker-macOS-*.dmg` for macOS, `AITracker-Windows-*.exe` for Windows and `AITracker-Linux-*.AppImage` / `.deb` / `.rpm` for Linux, with SHA-256 checksums in `checksums.txt`. The builds are unsigned, so macOS Gatekeeper or Windows SmartScreen may ask for a per-file confirmation on first launch.

          Install commands and platform notes: see the [README](https://github.com/estelwalks/aitracker#install), or run `npx --yes @estelwalks/aitracker@latest`.

          安装包见下方附件：macOS 用 `AITracker-macOS-*.dmg`，Windows 用 `AITracker-Windows-*.exe`，Linux 用 `AITracker-Linux-*.AppImage` / `.deb` / `.rpm`；SHA-256 校验值在 `checksums.txt`。构建未签名，macOS 的 Gatekeeper 或 Windows 的 SmartScreen 首次启动时可能要求确认。

          安装命令与平台说明见 [README](https://github.com/estelwalks/aitracker#install)，或直接运行 `npx --yes @estelwalks/aitracker@latest`。
          EOF

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_args=("$GITHUB_REF_NAME" --draft --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md)
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"

      - name: Upload release assets without clobbering existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/AITracker-macOS-*.dmg \
            release/AITracker-Windows-*.exe \
            release/AITracker-Linux-* \
            release/release-metadata.json \
            release/release-metadata-linux.json \
            release/checksums.txt

      # An install selects its installer by extension and architecture, then
      # requires the name recorded in that release's metadata to be an asset of
      # that same release. Half a rename — new asset names with metadata still
      # naming the old ones — therefore fails the in-app update on every install
      # of 1.0.3 and later. Compare the assets GitHub actually holds against the
      # metadata that was uploaded with them, which is the one pairing the
      # build-time checks cannot see.
      #
      # `gh release view` is deliberate: this runs while the release is still a
      # draft, and `GET /releases/tags/<tag>` answers 404 for a draft — not
      # because the tag or the assets are missing, but because the endpoint
      # serves published releases only. Reading the list that way failed the
      # v1.0.5 assembly after every installer had been built and uploaded.
      - name: Verify the draft's assets and metadata agree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name]' > drafted-assets.json
          gh release download "$GITHUB_REF_NAME" --pattern release-metadata.json --output drafted-release-metadata.json --clobber
          node scripts/verify-release-asset-agreement.mjs --assets drafted-assets.json --metadata drafted-release-metadata.json

      - name: Confirm draft outcome
        run: echo "Draft release created for $RELEASE_CHANNEL channel. A maintainer must inspect it before publication."
