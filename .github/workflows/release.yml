name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: 24
  RELEASE_CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}

jobs:
  release-contract:
    name: Release contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL"

      # The READMEs link /releases/latest/download/<alias>; the build job below
      # publishes those aliases. Fail before four runners start if the two
      # sides have drifted apart.
      - name: Verify README download links match the published aliases
        run: npm run verify:readme-release-links

  build:
    name: Build ${{ matrix.name }} installer
    needs: release-contract
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            platform: darwin-arm64
            command: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
            artifact_name: release-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            platform: darwin-x64
            command: npm run dist:mac:x64
            artifact_glob: release/*.dmg
            artifact_name: release-macos-x64
          - name: Windows x64
            os: windows-latest
            platform: win32-x64
            command: npm run dist:win:x64
            artifact_glob: release/*.exe
            artifact_name: release-windows-x64
          # Windows on ARM is cross-built on the x64 runner: electron-builder
          # downloads the win32-arm64 Electron payload and NSIS emits a
          # separate AITracker-Setup-<version>-arm64.exe. No ARM64 runner is
          # required to produce the installer.
          - name: Windows arm64
            os: windows-latest
            platform: win32-arm64
            command: npm run dist:win:arm64
            artifact_glob: release/*.exe
            artifact_name: release-windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # This workflow intentionally produces unsigned installers. No signing
      # identity, certificate, notarization, or SmartScreen credential is
      # configured here.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag before packaging (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL"

      - name: Verify tag before packaging (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run verify:release-contract -- --tag "$env:GITHUB_REF_NAME" --channel "$env:RELEASE_CHANNEL"

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Verify expected installer name (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL" --release-dir release --platform "$RELEASE_PLATFORM"

      - name: Verify expected installer name (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: npm run verify:release-contract -- --tag "$env:GITHUB_REF_NAME" --channel "$env:RELEASE_CHANNEL" --release-dir release --platform "$env:RELEASE_PLATFORM"

      - name: Upload installer for release assembly
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          compression-level: 0

  draft-release:
    name: Assemble GitHub draft release
    needs: [release-contract, build]
    if: ${{ needs.release-contract.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the four installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify assembled release artifacts
        shell: bash
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL" --release-dir release

      - name: Generate release metadata and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm run release:metadata -- --release-dir release --version "$version" --channel "$RELEASE_CHANNEL"

      - name: Refuse to reuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::A GitHub release already exists for $GITHUB_REF_NAME; refusing to overwrite it."
            exit 1
          fi

      # Release notes are never maintained here: the script extracts the
      # `## [<version>]` section of CHANGELOG.md and fails the job when that
      # section is missing or empty, so a tag can no longer ship generic or
      # stale notes.
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            cat > release-notes.md <<EOF
          # AITracker v${version}

          AITracker is an open-source, local-first AI workspace for understanding AI usage, managing capabilities, distilling reusable Skills, and building long-term knowledge and memory.

          ## Installation

          ### npx (macOS and Windows)

          \`\`\`bash
          npx --yes @estelwalks/aitracker@${version}
          \`\`\`

          ### Homebrew (macOS)

          \`\`\`bash
          brew tap estelwalks/aitracker
          brew install --cask estelwalks/aitracker/aitracker
          \`\`\`

          ### WinGet (Windows)

          \`\`\`powershell
          winget install --id estelwalks.AITracker -e
          \`\`\`

          ### Direct downloads

          Each release publishes versionless copies of its installers, so these URLs always resolve to the newest release:

          - macOS (Apple Silicon): https://github.com/estelwalks/aitracker/releases/latest/download/AITracker-arm64.dmg
          - macOS (Intel): https://github.com/estelwalks/aitracker/releases/latest/download/AITracker-x64.dmg
          - Windows (x64): https://github.com/estelwalks/aitracker/releases/latest/download/AITracker-Setup-x64.exe
          - Windows (ARM64): https://github.com/estelwalks/aitracker/releases/latest/download/AITracker-Setup-arm64.exe

          ## What's changed

          EOF
            echo "RELEASE_TITLE=AITracker $GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            cat > release-notes.md <<'EOF'
          Unsigned beta release for manual verification. Review the release assets and checksums before using this prerelease.

          ## What's changed

          EOF
            echo "RELEASE_TITLE=AITracker $GITHUB_REF_NAME (unsigned beta)" >> "$GITHUB_ENV"
          fi
          node scripts/changelog-release-notes.mjs --version "$version" --output - >> release-notes.md
          cat >> release-notes.md <<'EOF'

          ## Release assets

          This release includes unsigned macOS arm64/x64 DMG installers, Windows x64 and Windows arm64 NSIS installers, the four versionless aliases above, `release-metadata.json`, and `checksums.txt`. Verify the published SHA-256 checksums before installation.

          macOS Gatekeeper or Windows SmartScreen may show a warning because these installers are not signed or notarized. Follow the operating system's normal per-file confirmation flow and do not disable global security settings.

          See the [README](https://github.com/estelwalks/aitracker#readme) for the full feature overview, development commands, privacy model, and language versions.
          EOF

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_args=("$GITHUB_REF_NAME" --draft --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md)
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"

      - name: Upload release assets without clobbering existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/AITracker-*.dmg \
            release/AITracker-Setup-*.exe \
            release/release-metadata.json \
            release/checksums.txt

      # The README links every platform through
      # `releases/latest/download/<name>`, which GitHub resolves against the
      # newest published, non-prerelease release. The versioned installers
      # above cannot serve that role because their names change every release,
      # so each release also carries a versionless copy of its own installers.
      # The download URL is stable across releases; the bytes behind it always
      # belong to the release the URL resolves to. Copies are sparse clones of
      # the already-downloaded files, removed again before the job ends.
      - name: Publish versionless installer aliases
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cp --reflink=auto "AITracker-${version}-arm64.dmg" AITracker-arm64.dmg
          cp --reflink=auto "AITracker-${version}-x64.dmg" AITracker-x64.dmg
          cp --reflink=auto "AITracker-Setup-${version}-x64.exe" AITracker-Setup-x64.exe
          cp --reflink=auto "AITracker-Setup-${version}-arm64.exe" AITracker-Setup-arm64.exe
          for alias in AITracker-arm64.dmg AITracker-x64.dmg AITracker-Setup-x64.exe AITracker-Setup-arm64.exe; do
            if [[ "$alias" == *.exe ]]; then
              expected="AITracker-Setup-${version}-${alias#AITracker-Setup-}"
            else
              expected="AITracker-${version}-${alias#AITracker-}"
            fi
            if ! cmp --silent "$alias" "$expected"; then
              echo "::error::$alias does not match $expected"
              exit 1
            fi
          done
          gh release upload "$GITHUB_REF_NAME" \
            AITracker-arm64.dmg \
            AITracker-x64.dmg \
            AITracker-Setup-x64.exe \
            AITracker-Setup-arm64.exe
          rm -f AITracker-arm64.dmg AITracker-x64.dmg AITracker-Setup-x64.exe AITracker-Setup-arm64.exe

      - name: Confirm draft outcome
        run: echo "Draft release created for $RELEASE_CHANNEL channel. A maintainer must inspect it before publication."
