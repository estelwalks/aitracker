name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: 24
  RELEASE_CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}

jobs:
  release-contract:
    name: Release contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL"

      # Installer names are versionless so `releases/latest/download/<name>`
      # stays valid across releases. Fail before four runners start if the
      # packaging config, the release scripts or the READMEs have drifted.
      - name: Verify versionless installer names and README download links
        run: |
          npm run verify:release-artifact-names
          npm run verify:readme-release-links

  build:
    name: Build ${{ matrix.name }} installer
    needs: release-contract
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            platform: darwin-arm64
            command: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
            artifact_name: release-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            platform: darwin-x64
            command: npm run dist:mac:x64
            artifact_glob: release/*.dmg
            artifact_name: release-macos-x64
          - name: Windows x64
            os: windows-latest
            platform: win32-x64
            command: npm run dist:win:x64
            artifact_glob: release/*.exe
            artifact_name: release-windows-x64
          # Windows on ARM is cross-built on the x64 runner: electron-builder
          # downloads the win32-arm64 Electron payload and NSIS emits a
          # separate AITracker-Setup-<version>-arm64.exe. No ARM64 runner is
          # required to produce the installer.
          - name: Windows arm64
            os: windows-latest
            platform: win32-arm64
            command: npm run dist:win:arm64
            artifact_glob: release/*.exe
            artifact_name: release-windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # This workflow intentionally produces unsigned installers. No signing
      # identity, certificate, notarization, or SmartScreen credential is
      # configured here.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag before packaging (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL"

      - name: Verify tag before packaging (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run verify:release-contract -- --tag "$env:GITHUB_REF_NAME" --channel "$env:RELEASE_CHANNEL"

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Verify expected installer name (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL" --release-dir release --platform "$RELEASE_PLATFORM"

      - name: Verify expected installer name (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: npm run verify:release-contract -- --tag "$env:GITHUB_REF_NAME" --channel "$env:RELEASE_CHANNEL" --release-dir release --platform "$env:RELEASE_PLATFORM"

      - name: Upload installer for release assembly
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          compression-level: 0

  draft-release:
    name: Assemble GitHub draft release
    needs: [release-contract, build]
    if: ${{ needs.release-contract.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the four installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify assembled release artifacts
        shell: bash
        run: npm run verify:release-contract -- --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL" --release-dir release

      # Every client released before 1.0.2 accepts only
      # `releases/download/v<version>/<name>` and requires that asset to exist,
      # so each installer is published twice: under its versionless name (what
      # the README links and releases/latest/download use) and under a versioned
      # copy that keeps older installs able to update themselves. The copies are
      # byte-identical, and release-metadata.json names the versioned ones.
      - name: Publish versioned installer copies
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for copy in \
            "AITracker-arm64.dmg:AITracker-${version}-arm64.dmg" \
            "AITracker-x64.dmg:AITracker-${version}-x64.dmg" \
            "AITracker-Setup-arm64.exe:AITracker-Setup-${version}-arm64.exe" \
            "AITracker-Setup-x64.exe:AITracker-Setup-${version}-x64.exe"; do
            source="${copy%%:*}"
            target="${copy#*:}"
            cp --reflink=auto "$source" "$target"
            cmp --silent "$source" "$target" || {
              echo "::error::$target differs from $source"
              exit 1
            }
          done
          ls -1 AITracker-*

      - name: Generate release metadata and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm run release:metadata -- --release-dir release --version "$version" --channel "$RELEASE_CHANNEL"

      - name: Refuse to reuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::A GitHub release already exists for $GITHUB_REF_NAME; refusing to overwrite it."
            exit 1
          fi

      # Release notes stay short on purpose: the release page is an update
      # summary plus a pointer, not a second README. The changelog section is
      # the single source for "what changed"; installation methods, checksums
      # guidance and the signing caveat live in the README and RELEASE_CHECKLIST.
      # The script fails the job when the `## [<version>]` section is missing
      # or empty, so a tag can no longer ship generic or stale notes.
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            {
              echo "## What's changed"
              echo
            } > release-notes.md
            echo "RELEASE_TITLE=AITracker $GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            cat > release-notes.md <<'EOF'
          Unsigned beta release for manual verification. Review the assets and checksums before using this prerelease.

          ## What's changed

          EOF
            echo "RELEASE_TITLE=AITracker $GITHUB_REF_NAME (unsigned beta)" >> "$GITHUB_ENV"
          fi
          node scripts/changelog-release-notes.mjs --version "$version" --output - >> release-notes.md
          # Quoted heredoc: the inline code below must survive without backticks
          # being read as command substitution.
          cat >> release-notes.md <<'EOF'

          ## Download

          Installers are attached below: `AITracker-*.dmg` for macOS and `AITracker-Setup-*.exe` for Windows, with SHA-256 checksums in `checksums.txt`. The builds are unsigned, so macOS Gatekeeper or Windows SmartScreen may ask for a per-file confirmation on first launch.

          Install commands and platform notes: see the [README](https://github.com/estelwalks/aitracker#install), or run `npx --yes @estelwalks/aitracker@latest`.
          EOF

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_args=("$GITHUB_REF_NAME" --draft --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md)
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"

      - name: Upload release assets without clobbering existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The globs cover both the versionless installers and their versioned
          # copies; checksums.txt only lists the versionless names.
          gh release upload "$GITHUB_REF_NAME" \
            release/AITracker-*.dmg \
            release/AITracker-Setup-*.exe \
            release/release-metadata.json \
            release/checksums.txt

      - name: Confirm draft outcome
        run: echo "Draft release created for $RELEASE_CHANNEL channel. A maintainer must inspect it before publication."
