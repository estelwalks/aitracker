name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app + Electron + scanner)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Open-source hygiene
        run: npm run check:opensource-hygiene

      - name: Architecture boundaries (blocking)
        run: npm run verify:architecture:blocking

      # Bundle gates (verify:bundle-no-sqlite, verify:bundle-budget) scan
      # .output, so build first.
      - name: Build (for bundle gates)
        run: npm run build

      - name: Bundle size budget
        run: npm run verify:bundle-budget

      - name: Read-model performance budgets
        run: npm run verify:read-model-budgets

      # Compiles the Electron main/preload TypeScript project and bundles the
      # preload script, catching desktop-side type and bundling errors that
      # `npm run typecheck` (noEmit) cannot.
      - name: Electron build
        run: npm run build:electron

      - name: Database tests
        run: npm run test:database

      - name: Database schema
        run: npm run verify:database-schema

      - name: Browser/server source boundary
        run: npm run verify:browser-server-boundary

      # These audits remain visible while the inherited migration work is
      # completed. They are mandatory (without continue-on-error) for a release.
      - name: SQLite-only persistence audit (release blocker)
        continue-on-error: true
        run: npm run verify:sqlite-only

      - name: Public bundle privacy audit (release blocker)
        continue-on-error: true
        run: npm run verify:bundle-no-sqlite

      - name: Runtime policy verification
        run: npm run verify:runtime-policy

      - name: Job catalog verification
        run: npm run verify:job-catalog

      - name: Unit tests
        run: npm run test:unit

      - name: Repository tooling tests
        run: npm run test:scripts

      - name: Skill scanner tests
        run: npm run test:scanner

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
