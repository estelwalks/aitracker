name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Architecture boundaries (blocking)
        run: npm run verify:architecture:blocking

      # Bundle gates (verify:bundle-no-sqlite) scan .output, so build first.
      # NOTE: the P1-1 server-chunk gate intentionally FAILS on the current
      # build until server chunks are moved out of .output/public — a
      # deliberate release blocker tracked in the fix plan (F3-S2).
      - name: Build (for bundle gates)
        run: npm run build

      - name: Database verification
        run: npm run verify:database

      - name: Runtime policy verification
        run: npm run verify:runtime-policy

      - name: Job catalog verification
        run: npm run verify:job-catalog

      - name: Unit tests
        run: npm run test:unit
