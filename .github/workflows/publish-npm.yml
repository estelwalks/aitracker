name: Publish CLI to npm

# Publishes @estelwalks/aitracker so the documented
# `npx --yes @estelwalks/aitracker@latest` resolves to this release.
#
# Authentication uses npm trusted publishing: npm is configured with this
# repository and workflow as a trusted publisher, so the OIDC token issued here
# (id-token: write) authorizes the publish and the package is signed with
# provenance. No NPM_TOKEN secret is involved.
on:
  push:
    tags:
      - "v*"
  # Lets a tag that predates this workflow still be published, for example
  # `gh workflow run publish-npm.yml --ref v1.0.3`.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @estelwalks/aitracker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Verify the tag matches the CLI version
        shell: bash
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          echo "version=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match packages/cli/package.json ($version)"
              exit 1
            fi
          fi
          # A prerelease publishes under the npm dist-tag the READMEs document
          # for beta builds; a stable version follows `latest`. Deriving it here
          # keeps the publish and the assertion below on one source of truth.
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=beta; fi
          echo "dist_tag=$dist_tag" >> "$GITHUB_ENV"
          echo "Publishing @estelwalks/aitracker@$version under the $dist_tag dist-tag"

      - name: Check whether npm already serves this version
        id: existing
        shell: bash
        run: |
          if npm view "@estelwalks/aitracker@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "npm already serves ${version}; nothing to publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # `files` in packages/cli/package.json limits the tarball to bin/, src/
      # and README.md, so the CLI needs no build step.
      #
      # `--tag` is not optional for a prerelease. Without it npm publishes a
      # prerelease under `latest` as well as leaving the `beta` tag untouched,
      # so a beta would silently become what `npx @estelwalks/aitracker@latest`
      # installs.
      - name: Publish package
        if: steps.existing.outputs.published == 'false'
        run: npm publish ./packages/cli --provenance --access public --tag "$dist_tag"

      # Assert the dist-tag rather than setting it: trusted publishing
      # authorizes `npm publish` through the OIDC token, but `npm dist-tag add`
      # is an ordinary registry write that gets no such token and fails with
      # E401. `--tag` above is what moves the tag, and this step proves it
      # moved, which is the property every README and the generated release
      # notes depend on: `npx --yes @estelwalks/aitracker@latest` has to resolve
      # to this release.
      #
      # It runs whether or not this run published, so re-running the workflow
      # for a tag npm already serves still verifies the tag. The registry can
      # answer with the previous dist-tag for a few seconds after a successful
      # `npm publish` (v1.0.6's run read `latest = 1.0.5` immediately after the
      # publish exited 0), so the read is retried before it is treated as a
      # failure.
      - name: Confirm the dist-tag follows this release
        shell: bash
        run: |
          resolved=""
          for attempt in $(seq 1 8); do
            resolved="$(npm view "@estelwalks/aitracker@${dist_tag}" version)"
            if [[ "$resolved" == "$version" ]]; then break; fi
            echo "attempt ${attempt}: ${dist_tag} still resolves to ${resolved}"
            sleep 15
          done
          if [[ "$resolved" != "$version" ]]; then
            echo "::error::dist-tag $dist_tag resolves to $resolved, not $version"
            exit 1
          fi
          echo "$dist_tag resolves to $resolved" >> "$GITHUB_STEP_SUMMARY"
          npm dist-tag ls "@estelwalks/aitracker" >> "$GITHUB_STEP_SUMMARY"
