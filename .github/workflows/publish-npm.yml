name: Publish CLI to npm

# Publishes @estelwalks/aitracker so the documented
# `npx --yes @estelwalks/aitracker@latest` resolves to this release.
#
# Authentication uses npm trusted publishing: npm is configured with this
# repository and workflow as a trusted publisher, so the OIDC token issued here
# (id-token: write) authorizes the publish and the package is signed with
# provenance. No NPM_TOKEN secret is involved.
on:
  push:
    tags:
      - "v*"
  # Lets a tag that predates this workflow still be published, for example
  # `gh workflow run publish-npm.yml --ref v1.0.3`.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @estelwalks/aitracker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Verify the tag matches the CLI version
        shell: bash
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          echo "version=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match packages/cli/package.json ($version)"
              exit 1
            fi
          fi
          echo "Publishing @estelwalks/aitracker@$version"

      - name: Check whether npm already serves this version
        id: existing
        shell: bash
        run: |
          if npm view "@estelwalks/aitracker@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "npm already serves ${version}; nothing to publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # `files` in packages/cli/package.json limits the tarball to bin/, src/
      # and README.md, so the CLI needs no build step.
      - name: Publish package
        if: steps.existing.outputs.published == 'false'
        run: npm publish ./packages/cli --provenance --access public

      # `latest` and `beta` must follow the release: every README and the
      # generated release notes document `npx --yes @estelwalks/aitracker@latest`,
      # which resolves through the dist-tag.
      - name: Point the dist-tag at this release
        if: steps.existing.outputs.published == 'false'
        shell: bash
        run: |
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=beta; fi
          npm dist-tag add "@estelwalks/aitracker@${version}" "$dist_tag"
          npm dist-tag ls @estelwalks/aitracker >> "$GITHUB_STEP_SUMMARY"
